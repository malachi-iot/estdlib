name: ESP-IDF

on:
  push:
    branches: [ "feat/**", "alpha" ]

jobs:
  select-profile:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v6
    - id: matrix
      shell: bash
      working-directory: tools/github
      run: |
        MATRIX=$(./get-matrix esp-idf "${GITHUB_REF_NAME}")
        echo "MATRIX=$MATRIX" >&2
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      #run: ./get-matrix esp-idf ${GITHUB_REF_NAME} >> "$GITHUB_OUTPUT"
    - name: Diagnostic
      run: |
        echo "---- GITHUB OUTPUT ----"
        cat "$GITHUB_OUTPUT"

  build:
    needs: select-profile
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.select_profile.outputs.matrix) }}
        #version: [v5.3.5, v5.4.4, v5.5.4, v6.0]
        #target: [esp32, esp32s3, esp32c6]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: esp-idf option prep
      if: matrix.version == 'v6.0' && matrix.target != 'esp32c6'
      run: |
        cat >> $GITHUB_ENV <<EOF
        BUILD_OPT="-DSDKCONFIG_DEFAULTS=sdkconfig.defaults.ci;sdkconfig.defaults"
        ENABLE_QEMU=true
        EOF
    - name: "esp-idf build"
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/unity'
        #command: "idf.py build ${BUILD_OPT}"
        command: "idf.py build ${{ env.BUILD_OPT }}"
    # 27APR26 MB TODO: Rework this to be a needs: relationship
    - name: "esp-idf qemu"
      timeout-minutes: 1
      if: env.ENABLE_QEMU=='true'
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/unity'
        command: idf.py qemu --qemu-extra-args="-no-reboot" | tee qemu_output.txt
    - name: "QEMU output inspection"
      if: env.ENABLE_QEMU=='true'
      # 27APR26 MB: Not doing much right now.  Need to pipe/redirect qemu_output
      # into it
      run: tools/esp-idf/unity-gh-action.py
